<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Song List</title>
<style>
body{font-family:Segoe UI,Arial,sans-serif;background:#181818;color:#fff;margin:0;padding:16px}
main{max-width:900px;margin:0 auto}h1{margin:.2em 0}p{color:#aaa}
input{width:100%;box-sizing:border-box;padding:12px;font-size:16px;border-radius:8px;border:1px solid #444;background:#2b2b2b;color:#fff}
table{width:100%;border-collapse:collapse;margin-top:12px}td,th{padding:8px;text-align:left;border-bottom:1px solid #333}
th{color:#aaa}tr:hover td{background:#2b2b2b}code{background:#333;padding:2px 6px;border-radius:4px;color:#4CAF50}
</style></head><body><main>
<h1>Song List</h1>
<p>Request a song in chat with <code>!sr song name</code> or with the Song Request channel point reward. <span id="count"></span></p>
<input id="q" type="search" placeholder="Search songs or artists" autofocus>
<table><thead><tr><th>Song</th><th>Artist</th></tr></thead><tbody id="rows"></tbody></table>
</main><script>
const songs=[{"t":"Kryptonite","a":"3 Doors Down"},{"t":"When Im Gone","a":"3 Doors Down"},{"t":"I Dont Wanna Miss A Thing","a":"Aerosmith"},{"t":"Sweet Emotion","a":"Aerosmith"},{"t":"'Tired of Being Alone'","a":"Al Green"},{"t":"'Man in the Box'","a":"Alice In Chains"},{"t":"'If I Ain't Got You'","a":"Alicia Keys"},{"t":"Fallin","a":"Alicia Keys"},{"t":"Like A Stone","a":"Audioslave"},{"t":"'Word to the Mutha'","a":"Bell Biv Devoe"},{"t":"Lovely Day","a":"Bill Withers"},{"t":"Jammin - Bob Marley","a":"Bob Marley"},{"t":"Stir It Up","a":"Bob Marley"},{"t":"Waiting in Vain","a":"Bob Marley"},{"t":"Blaze Of Glory","a":"Bon Jovi"},{"t":"Livin On A Prayer","a":"Bon Jovi"},{"t":"Uptown Funk","a":"Bruno Mars"},{"t":"Comedown","a":"Bush"},{"t":"Word Up","a":"Cameo"},{"t":"Forget You","a":"CeeLo Green"},{"t":"Tell Me Something Good","a":"Chaka Khan"},{"t":"Clocks","a":"Coldplay"},{"t":"In My Place","a":"Coldplay"},{"t":"Paradise","a":"Coldplay"},{"t":"Shiver","a":"Coldplay"},{"t":"Speed of Sound","a":"Coldplay"},{"t":"Run Through The Jungle","a":"Creedence Clearwater Revival"},{"t":"Let it Whip","a":"Dazz Band"},{"t":"'U Know What's Up' - Donnell Jones","a":"Donnell Jones"},{"t":"September","a":"Earth Wind & Fire"},{"t":"'Don't Let Go'","a":"En Vogue"},{"t":"Going Under","a":"Evanescence"},{"t":"Learn To Fly","a":"Foo Fighters"},{"t":"Hemorrhage","a":"Fuel"},{"t":"'Feeling Irie'","a":"General Degree"},{"t":"Iris","a":"Goo Goo Dolls"},{"t":"Feel Good Inc.","a":"Gorillaz"},{"t":"I Cant Go For That","a":"Hall & Oates"},{"t":"Maneater","a":"Hall & Oates"},{"t":"Dig","a":"Incubus"},{"t":"Drive","a":"Incubus"},{"t":"Stellar","a":"Incubus"},{"t":"ABC","a":"Jackson 5"},{"t":"Dirt Road Anthem","a":"Jason Aldean"},{"t":"Run This Town","a":"Jay-Z"},{"t":"Little Wing","a":"Jimi Hendrix"},{"t":"Doo Wop (That Thing)","a":"Lauryn Hill"},{"t":"Again","a":"Lenny Kravitz"},{"t":"Are You Gonna Go My Way","a":"Lenny Kravitz"},{"t":"Crawling","a":"Linkin Park"},{"t":"Somewhere I Belong","a":"Linkin Park"},{"t":"What Ive Done","a":"Linkin Park"},{"t":"Simple Man","a":"lynyrd Skynyrd"},{"t":"'3 AM'","a":"Matchbox Twenty"},{"t":"Beat It","a":"Michael Jackson"},{"t":"Dangerous","a":"Michael Jackson"},{"t":"Dirty Diana","a":"Michael Jackson"},{"t":"Liberian Girl","a":"Michael Jackson"},{"t":"Inside My Love","a":"Minnie Ripperton"},{"t":"'Like This and That'","a":"Monica"},{"t":"Never Again","a":"Nickelback"},{"t":"Photograph","a":"Nickelback"},{"t":"Someday","a":"Nickelback"},{"t":"Come As You Are","a":"Nirvana"},{"t":"In Bloom","a":"Nirvana"},{"t":"Something In The Way","a":"Nirvana"},{"t":"'It's My Life'","a":"No Doubt"},{"t":"'Underneath It All'","a":"No Doubt"},{"t":"Dont Speak","a":"No Doubt"},{"t":"Hella Good","a":"No Doubt"},{"t":"Sittin on the Dock of the Bay","a":"Otis Redding"},{"t":"Baby Im A Star","a":"Prince"},{"t":"Computer Blue","a":"Prince"},{"t":"Cream","a":"Prince"},{"t":"Money Dont Matter 2 Night","a":"Prince"},{"t":"Blurred Lines","a":"Robin Thicke"},{"t":"Smooth Operator","a":"Sade"},{"t":"Body Like A Back Road","a":"Sam Hunt"},{"t":"Country Song","a":"Seether"},{"t":"Snoops Upside Your Head","a":"Snoop Dogg"},{"t":"Livin for the City","a":"Stevie Wonder"},{"t":"'Plush'","a":"Stone Temple Pilots"},{"t":"Killing Me Softly","a":"The Fugees"},{"t":"'You Dropped A Bomb On Me'","a":"The Gap Band"},{"t":"Burn Rubber On Me","a":"The Gap Band"},{"t":"Dont Say Nuthin","a":"The Roots"},{"t":"The Seed 2.0","a":"The Roots"},{"t":"I Cant Feel My Face","a":"The Weeknd"},{"t":"Whats Love Got to Do With It","a":"Tina Turner"},{"t":"I Love This Bar","a":"Toby Keith"},{"t":"Shouldve Been A Cowboy","a":"Toby Keith"},{"t":"Everything You Want","a":"Vertical Horizon"},{"t":"Here I Go Again - Whitesnake","a":"Whitesnake"},{"t":"I Wanna Dance With Somebody","a":"Whitney Houston"}];
const rows=document.getElementById('rows'),q=document.getElementById('q');
document.getElementById('count').textContent=songs.length+' songs.';
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function show(){const f=q.value.toLowerCase();rows.innerHTML=songs.filter(s=>!f||(s.t+' '+s.a).toLowerCase().includes(f)).map(s=>'<tr><td>'+esc(s.t)+'</td><td>'+esc(s.a)+'</td></tr>').join('')}
q.addEventListener('input',show);show();
</script></body></html>
